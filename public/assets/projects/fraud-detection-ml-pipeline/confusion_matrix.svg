<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="Confusion matrix for the AE latent-oversample tuned model on the test set">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172033" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1200" height="760" rx="0" fill="#fbfcff" stroke="none"/>
<text x="64" y="76" font-size="32" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="850" text-anchor="start" fill="#172033">Confusion Matrix &#8212; AE Latent-Oversample (Tuned)</text>
<text x="64" y="110" font-size="17" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500" text-anchor="start" fill="#5d667a">Test set, n = 118,108 &#183; threshold 0.14, selected on validation via F1</text>

<!-- column headers -->
<text x="480" y="168" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle" fill="#5d667a">Predicted: Legit</text>
<text x="800" y="168" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle" fill="#5d667a">Predicted: Fraud</text>

<!-- row headers -->
<text x="180" y="290" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="end" fill="#5d667a">Actual: Legit</text>
<text x="180" y="490" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="end" fill="#5d667a">Actual: Fraud</text>

<!-- TN cell -->
<rect x="350" y="184" width="260" height="180" rx="10" fill="#3366cc" opacity="0.90"/>
<text x="480" y="252" font-size="34" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="900" text-anchor="middle" fill="#ffffff">113,596</text>
<text x="480" y="280" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle" fill="#ffffff">TN &#183; 99.67% of actual legit</text>
<text x="480" y="330" font-size="12.5" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500" text-anchor="middle" fill="#eaf0ff">correctly rejected</text>

<!-- FP cell -->
<rect x="670" y="184" width="260" height="180" rx="10" fill="#e15759" opacity="0.18"/>
<text x="800" y="252" font-size="34" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="900" text-anchor="middle" fill="#9a3a3b">380</text>
<text x="800" y="280" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle" fill="#9a3a3b">FP &#183; 0.33% of actual legit</text>
<text x="800" y="330" font-size="12.5" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500" text-anchor="middle" fill="#9a3a3b">false alarms</text>

<!-- FN cell -->
<rect x="350" y="384" width="260" height="180" rx="10" fill="#e15759" opacity="0.42"/>
<text x="480" y="452" font-size="34" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="900" text-anchor="middle" fill="#7a2224">1,045</text>
<text x="480" y="480" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle" fill="#7a2224">FN &#183; 25.29% of actual fraud</text>
<text x="480" y="530" font-size="12.5" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500" text-anchor="middle" fill="#7a2224">missed fraud</text>

<!-- TP cell -->
<rect x="670" y="384" width="260" height="180" rx="10" fill="#1f7a8c" opacity="0.92"/>
<text x="800" y="452" font-size="34" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="900" text-anchor="middle" fill="#ffffff">3,087</text>
<text x="800" y="480" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle" fill="#ffffff">TP &#183; 74.71% of actual fraud</text>
<text x="800" y="530" font-size="12.5" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500" text-anchor="middle" fill="#eaf7f7">fraud caught</text>

<rect x="64" y="600" width="1072" height="70" rx="8" fill="#ffffff" stroke="#e5e9f2"/>
<text x="90" y="632" font-size="15.5" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="750" text-anchor="start" fill="#172033">Recall (fraud) 74.71% &#183; Precision 89.04% &#183; F1 0.8125</text>
<text x="90" y="656" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500" text-anchor="start" fill="#5d667a">vs. tuned baseline: +41 fraud caught (3,087 vs 3,046), +55 false positives (380 vs 325)</text>

<rect x="64" y="690" width="1072" height="52" rx="8" fill="#f1f8ff" stroke="#cfe4ff"/>
<text x="90" y="721" font-size="14.5" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="start" fill="#172033">No paired-bootstrap significance test was run on this specific submitted checkpoint &#8212; see write-up for the earlier run where the AE-vs-baseline gap was bootstrap-tested (p&lt;0.001).</text>
</svg>
