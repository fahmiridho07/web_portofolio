<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Test PR-AUC comparison across baseline, SMOTE-NC, and AE latent-oversampling, tuned and untuned">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172033" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#fbfcff" stroke="none"/>
<text x="64" y="76" font-size="34" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="850" text-anchor="start" fill="#172033">Test PR-AUC (Average Precision) by Scenario</text>
<text x="64" y="112" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500" text-anchor="start" fill="#5d667a">IEEE-CIS fraud detection &#183; stratified 60/20/20 split, seed 42 &#183; test set, n=118,108. Y-axis starts at 0.78.</text>

<rect x="54" y="150" width="1332" height="718" rx="8" fill="#ffffff" stroke="#e5e9f2"/>

<line x1="100" y1="660" x2="1330" y2="660" stroke="#e7ebf3" stroke-width="1"/>
<text x="86" y="665" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500" text-anchor="end" fill="#5d667a">0.78</text>
<line x1="100" y1="545" x2="1330" y2="545" stroke="#e7ebf3" stroke-width="1"/>
<text x="86" y="550" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500" text-anchor="end" fill="#5d667a">0.80</text>
<line x1="100" y1="430" x2="1330" y2="430" stroke="#e7ebf3" stroke-width="1"/>
<text x="86" y="435" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500" text-anchor="end" fill="#5d667a">0.82</text>
<line x1="100" y1="315" x2="1330" y2="315" stroke="#e7ebf3" stroke-width="1"/>
<text x="86" y="320" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500" text-anchor="end" fill="#5d667a">0.84</text>
<line x1="100" y1="200" x2="1330" y2="200" stroke="#e7ebf3" stroke-width="1"/>
<text x="86" y="205" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500" text-anchor="end" fill="#5d667a">0.86</text>

<!-- Baseline group -->
<rect x="200" y="496.7" width="90" height="163.3" rx="4" fill="#9fb0c9" stroke="none" opacity="0.9"/>
<text x="245" y="486.7" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle" fill="#5d667a">0.8084</text>
<rect x="310" y="259.2" width="90" height="400.8" rx="4" fill="#3366cc" stroke="none" opacity="0.9"/>
<text x="355" y="249.2" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle" fill="#172033">0.8497</text>
<text x="300" y="694" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle" fill="#5d667a"><tspan x="300" dy="0">Baseline</tspan><tspan x="300" dy="18">(LightGBM only)</tspan></text>

<!-- SMOTE-NC group -->
<rect x="620" y="454.7" width="90" height="205.3" rx="4" fill="#9fb0c9" stroke="none" opacity="0.9"/>
<text x="665" y="444.7" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle" fill="#5d667a">0.8157</text>
<rect x="730" y="257.5" width="90" height="402.5" rx="4" fill="#3366cc" stroke="none" opacity="0.9"/>
<text x="775" y="247.5" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle" fill="#172033">0.8500</text>
<text x="720" y="694" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle" fill="#5d667a"><tspan x="720" dy="0">SMOTE-NC</tspan><tspan x="720" dy="18">(matched control)</tspan></text>

<!-- AE latent-oversample group -->
<rect x="1040" y="391.5" width="90" height="268.5" rx="4" fill="#9fb0c9" stroke="none" opacity="0.9"/>
<text x="1085" y="381.5" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle" fill="#5d667a">0.8267</text>
<rect x="1150" y="230.5" width="90" height="429.5" rx="4" fill="#1f7a8c" stroke="#1f7a8c" stroke-width="3"/>
<text x="1195" y="220.5" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="900" text-anchor="middle" fill="#1f7a8c">0.8547</text>
<text x="1140" y="694" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle" fill="#5d667a"><tspan x="1140" dy="0">AE Latent-Oversample</tspan><tspan x="1140" dy="18">(ours)</tspan></text>

<!-- legend -->
<rect x="100" y="184" width="24" height="14" rx="3" fill="#9fb0c9" stroke="none"/>
<text x="134" y="198" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#5d667a">Untuned (default LightGBM)</text>
<rect x="400" y="184" width="24" height="14" rx="3" fill="#3366cc" stroke="none"/>
<text x="434" y="198" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#5d667a">Tuned (Optuna TPE)</text>

<rect x="100" y="742" width="560" height="88" rx="8" fill="#eef7f7" stroke="#bfe0e0"/>
<text x="126" y="774" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="850" text-anchor="start" fill="#1f7a8c">Best result</text>
<text x="126" y="806" font-size="15.5" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="start" fill="#172033">AE latent-oversample, tuned: AP 0.8547 &#8212; +0.0049 vs baseline tuned, +0.0046 vs SMOTE-NC tuned.</text>

<rect x="704" y="742" width="560" height="88" rx="8" fill="#f1f8ff" stroke="#cfe4ff"/>
<text x="730" y="774" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="850" text-anchor="start" fill="#3366cc">Tuning matters most</text>
<text x="730" y="806" font-size="15.5" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="start" fill="#172033">Bayesian tuning adds +0.03&#8211;0.04 AP in every scenario &#8212; but AE still wins tuned vs. tuned.</text>
</svg>
