<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-label="Bayesian Optimization versus random search comparison">
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172033" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1440" height="640" rx="0" fill="#fbfcff" stroke="none"/>
<text x="64" y="76" font-size="34" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="850" text-anchor="start" fill="#172033">Bayesian Optimization vs. Random Search</text>
<text x="64" y="112" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500" text-anchor="start" fill="#5d667a">Same 7-D LightGBM search space, same 10-trial budget, AE-oversample scenario.</text>

<rect x="54" y="150" width="1332" height="200" rx="8" fill="#ffffff" stroke="#e5e9f2"/>
<text x="86" y="182" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" fill="#5d667a">Validation PR-AUC (higher is better)</text>

<line x1="300" y1="230" x2="300" y2="230" stroke="none"/>
<text x="130" y="238" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#172033">Bayesian Opt. (TPE)</text>
<rect x="300" y="212" width="850.7" height="34" rx="4" fill="#1f7a8c" stroke="none"/>
<text x="1165" y="234" font-size="16" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="900" text-anchor="start" fill="#1f7a8c">0.8589</text>

<text x="130" y="298" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start" fill="#172033">Random Search</text>
<rect x="300" y="272" width="666.5" height="34" rx="4" fill="#9fb0c9" stroke="none"/>
<text x="981" y="294" font-size="16" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="900" text-anchor="start" fill="#5d667a">0.8548</text>

<line x1="300" y1="150" x2="300" y2="350" stroke="#e7ebf3" stroke-width="1"/>
<text x="300" y="342" font-size="12" font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle" fill="#5d667a">0.84</text>

<!-- stat cards -->
<rect x="100" y="392" width="600" height="190" rx="12" fill="#eef7f7" stroke="#bfe0e0"/>
<text x="130" y="432" font-size="19" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="850" fill="#1f7a8c">Bayesian Optimization (TPE)</text>
<text x="130" y="466" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" fill="#172033">Test PR-AUC: 0.8575</text>
<text x="130" y="494" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" fill="#172033">Total tuning time: 5,844.6 s (~97.4 min)</text>
<text x="130" y="522" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" fill="#172033">Trials: 10 &#183; Sampler: Optuna TPESampler</text>
<text x="130" y="550" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" fill="#1f7a8c">+0.0041 val PR-AUC vs. random search</text>

<rect x="740" y="392" width="600" height="190" rx="12" fill="#f8f9fc" stroke="#e5e9f2"/>
<text x="770" y="432" font-size="19" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="850" fill="#5d667a">Random Search</text>
<text x="770" y="466" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" fill="#172033">Test PR-AUC: 0.8542</text>
<text x="770" y="494" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" fill="#172033">Total tuning time: 5,919.2 s (~98.7 min)</text>
<text x="770" y="522" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" fill="#172033">Trials: 10 &#183; same search space</text>
<text x="770" y="550" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" fill="#5d667a">Baseline tuning strategy</text>

<text x="100" y="616" font-size="14.5" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500" fill="#5d667a">Bayesian Optimization reached a higher validation score at effectively the same compute budget (~1.3% faster) &#8212; the basis for choosing Optuna/TPE over random search.</text>
</svg>
